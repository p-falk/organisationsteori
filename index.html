<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz om organisationsteori</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 1rem;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #39352f;
  color: #2b241c;
  font-family: 'Helvetica', 'Courier New', monospace;
}

.card {
  width: 100%;
  max-width: 760px;
  padding: 3rem 3.5rem;
  background: #ece5d3;
  border: 1px solid #b8ad93;
  border-radius: 3px;
  box-shadow: 2px 3px 12px rgba(0, 0, 0, .5);
}

h1 {
  margin-top: 0;
  font-size: 2.6rem;
  font-weight: 400;
  letter-spacing: 1px;
  text-align: center;
}

h2 {
  font-size: 1.9rem;
  font-weight: 400;
  line-height: 1.4;
}

.intro p {
  font-size: 1.5rem;
  line-height: 1.7;
}

button {
  display: block;
  width: 100%;
  margin: 8px 0;
  padding: 18px;
  border: 1px solid #2b241c;
  border-radius: 2px;
  background: #d9d0ba;
  color: #2b241c;
  font: inherit;
  font-size: 1.3rem;
  cursor: pointer;
  transition: background .2s ease, box-shadow .2s ease;
}

button:hover:not(:disabled) {
  background: #cfc5ab;
  box-shadow: 0 6px 14px rgba(0, 0, 0, .25);
}

button:disabled {
  cursor: default;
  opacity: .6;
}

button.correct {
  border-color: #5a6e37;
  background: #5a6e37;
  color: #ece5d3;
}

button.wrong {
  border-color: #8c3a32;
  background: #8c3a32;
  color: #ece5d3;
}

.progress-bar {
  height: 12px;
  margin: 1.25rem 0 .5rem;
  overflow: hidden;
  border-radius: 2px;
  background: rgba(43, 36, 28, .15);
}

.progress-bar-fill {
  width: 0;
  height: 100%;
  border-radius: 2px;
  background: #5a6e37;
  transition: width .4s ease;
}

.progress {
  margin-bottom: 1rem;
  font-size: 1.1rem;
  opacity: .75;
}

#options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

#options button {
  flex: 1 1 30%;
  margin: 8px 0 0;
  text-align: left;
}

.alt-letter {
  margin-right: .4em;
  font-weight: bold;
}

.alt-a .alt-letter { color: #8c3a32; }
.alt-b .alt-letter { color: #2c5f8a; }
.alt-c .alt-letter { color: #7a5a12; }

.feedback {
  height: 2.6rem;
  margin: .75rem 0 .25rem;
  overflow: hidden;
  font-size: 1.6rem;
  font-weight: bold;
  text-align: center;
}

.feedback.right { color: #3d5024; }
.feedback.wrong { color: #8c3a32; }

.explain {
  height: 8.6rem;
  margin: .5rem 0 .25rem;
  overflow-y: auto;
  font-size: 1.15rem;
  line-height: 1.6;
  text-align: center;
  opacity: .9;
}

.hidden {
  display: none !important;
}

.ghosted {
  visibility: hidden;
}

.result {
  line-height: 1.6;
}

@media (max-width: 480px) {
  body {
    align-items: flex-start;
  }

  .card {
    padding: 1.75rem 1.25rem;
  }

  h1 { font-size: 2.1rem; }
  h2 { font-size: 1.55rem; }
  .intro p { font-size: 1.3rem; }

  button {
    padding: 16px 10px;
    font-size: 1.15rem;
  }

  #options button {
    flex-basis: 100%;
  }

  .feedback {
    height: 2.2rem;
    font-size: 1.4rem;
  }

  .explain {
    height: 11rem;
    font-size: 1rem;
  }
}
</style>
</head>

<body>
<main class="card">

  <section id="page0" class="intro">
    <h1>Organisationsteori</h1>
    <p style="text-align:center">
      Svara på frågorna och se hur många rätt du får!
    </p>
    <button id="startBtn">Fortsätt</button>
  </section>

  <section id="page1" class="intro hidden">
    <p>Du kommer att få åtta frågor om organisationsteori.</p>
    <p>Läs frågorna och svarsalternativen noga.</p>
    <button id="beginBtn">Börja quizet</button>
  </section>

  <section id="quizPage" class="hidden">
    <div id="question"></div>
    <div id="options"></div>

    <div class="progress-bar">
      <div id="barFill" class="progress-bar-fill"></div>
    </div>

    <div id="progress" class="progress"></div>
    <div id="feedback" class="feedback"></div>
    <p id="explain" class="explain"></p>

    <button id="nextBtn" class="ghosted">Fortsätt</button>
    <button id="restartBtn" class="hidden">Börja om</button>
  </section>

</main>

<script>
const questions = [
  {
    q: "Hur gammal är organisationsteorin som egen akademisk disciplin?",
    options: [
      "Den etablerades på 1980-talet",
      "Den växte fram under det tidiga 1900-talet",
      "Den har funnits sedan antiken"
    ],
    answer: 1,
    explain: "Organisationsteorin har rötter hos bland andra Max Weber kring sekelskiftet 1900. Ämnet utvecklades vidare under 1930-, 1940- och 1950-talen, bland annat genom Herbert Simons Administrative Behavior från 1947."
  },
  {
    q: "Vilken av följande räknas som en av organisationsteorins grundare?",
    options: [
      "Frederick Taylor",
      "Peter Drucker",
      "Abraham Maslow"
    ],
    answer: 0,
    explain: "Taylors Scientific Management från 1911 var ett tidigt systematiskt försök att studera och organisera arbete."
  },
  {
    q: "Vilken beskrivning ligger närmast en klassisk definition av en organisation?",
    options: [
      "En grupp människor som delar samma intressen",
      "Ett socialt system där verksamheten samordnas medvetet och som har relativt tydliga gränser",
      "Ett företag som säljer varor eller tjänster för att gå med vinst"
    ],
    answer: 1,
    explain: "Organisationer kännetecknas ofta av samordnad verksamhet och relativt tydliga gränser. De kan också ha en hierarkisk struktur."
  },
  {
    q: "Vilka två betydelser kan ordet ”organisation” ha inom ämnet?",
    options: [
      "Enbart företagsstrukturer",
      "Både ett socialt system och processen att organisera",
      "Enbart formella myndigheter"
    ],
    answer: 1,
    explain: "Ordet kan syfta både på en organisation som ett socialt system och på den pågående processen att organisera."
  },
  {
    q: "Vilken klassisk teoretiker beskrev byråkratin som en idealtyp?",
    options: [
      "Max Weber",
      "Émile Durkheim",
      "Michel Foucault"
    ],
    answer: 0,
    explain: "Weber beskrev byråkratin som en organisationsform med bland annat regler, hierarki, skriftlig dokumentation och opersonliga relationer."
  },
  {
    q: "Vilka studier bidrog till utvecklingen av den så kallade mänskliga relationernas skola?",
    options: [
      "Hawthorne-studierna",
      "Stanfordfängelseexperimentet",
      "Framinghamstudien om hjärtsjukdomar"
    ],
    answer: 0,
    explain: "Hawthorne-studierna genomfördes 1924–1932. De bidrog till att rikta uppmärksamheten mot sociala relationer och andra mänskliga faktorer i arbetslivet."
  },
  {
    q: "Vilket begrepp förknippas med Herbert Simons beskrivning av beslutsfattares begränsade rationalitet?",
    options: [
      "Instinktiv rationalitet",
      "Begränsad rationalitet (bounded rationality)",
      "Kollektiv intuition"
    ],
    answer: 1,
    explain: "Simon använde begreppet begränsad rationalitet för att beskriva hur beslut påverkas av begränsad information och begränsad förmåga att överblicka alla alternativ."
  },
  {
    q: "Vad kännetecknar kontingensteorin inom organisationsteori?",
    options: [
      "Det finns en enda organisationsform som passar i alla situationer",
      "En lämplig organisationsstruktur beror på faktorer som omgivning, teknik och storlek",
      "Organisationer strävar alltid mot kaos"
    ],
    answer: 1,
    explain: "Kontingensteorin utgår från att en lämplig organisationsform beror på organisationens förutsättningar och situation."
  }
];

let questionIndex = 0;
let score = 0;

const page0 = document.getElementById("page0");
const page1 = document.getElementById("page1");
const quizPage = document.getElementById("quizPage");
const nextBtn = document.getElementById("nextBtn");
const restartBtn = document.getElementById("restartBtn");

document.getElementById("startBtn").addEventListener("click", () => {
  page0.classList.add("hidden");
  page1.classList.remove("hidden");
});

document.getElementById("beginBtn").addEventListener("click", startQuiz);
nextBtn.addEventListener("click", nextQuestion);
restartBtn.addEventListener("click", resetQuiz);

function startQuiz() {
  questionIndex = 0;
  score = 0;
  page0.classList.add("hidden");
  page1.classList.add("hidden");
  quizPage.classList.remove("hidden");
  showQuestion();
}

function showQuestion() {
  const question = questions[questionIndex];
  const optionsContainer = document.getElementById("options");
  const feedback = document.getElementById("feedback");
  const explain = document.getElementById("explain");
  const letters = ["A", "B", "C"];
  const optionClasses = ["alt-a", "alt-b", "alt-c"];

  document.getElementById("question").innerHTML = `<h2>${question.q}</h2>`;
  document.getElementById("progress").textContent =
    `Fråga ${questionIndex + 1} av ${questions.length} — Poäng: ${score}`;
  document.getElementById("barFill").style.width =
    `${(questionIndex / questions.length) * 100}%`;

  optionsContainer.innerHTML = "";
  feedback.textContent = "";
  feedback.className = "feedback";
  explain.textContent = "";
  explain.scrollTop = 0;

  nextBtn.classList.add("ghosted");
  nextBtn.classList.remove("hidden");
  nextBtn.textContent =
    questionIndex === questions.length - 1 ? "Visa resultat" : "Fortsätt";
  restartBtn.classList.add("hidden");

  question.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.classList.add(optionClasses[index]);
    button.innerHTML =
      `<span class="alt-letter">${letters[index]}.</span> ${option}`;
    button.addEventListener("click", () => answerQuestion(index, button));
    optionsContainer.appendChild(button);
  });
}

function answerQuestion(selectedIndex, selectedButton) {
  const question = questions[questionIndex];
  const optionButtons = document.querySelectorAll("#options button");
  const feedback = document.getElementById("feedback");

  if (optionButtons[0].disabled) return;

  optionButtons.forEach(button => {
    button.disabled = true;
  });

  if (selectedIndex === question.answer) {
    score++;
    selectedButton.classList.add("correct");
    feedback.textContent = "✔ Rätt svar!";
    feedback.classList.add("right");
    document.getElementById("explain").textContent = question.explain;
  } else {
    selectedButton.classList.add("wrong");
    optionButtons[question.answer].classList.add("correct");
    feedback.textContent = "✘ Fel svar";
    feedback.classList.add("wrong");
    document.getElementById("explain").textContent =
      `Rätt svar: ${question.options[question.answer]} — ${question.explain}`;
  }

  document.getElementById("barFill").style.width =
    `${((questionIndex + 1) / questions.length) * 100}%`;
  nextBtn.classList.remove("ghosted");
}

function nextQuestion() {
  if (nextBtn.classList.contains("ghosted")) return;

  questionIndex++;

  if (questionIndex >= questions.length) {
    showResults();
  } else {
    showQuestion();
  }
}

function showResults() {
  document.getElementById("question").innerHTML =
    `<h2>Du fick ${score} av ${questions.length} rätt!</h2>`;

  document.getElementById("options").innerHTML = "";
  document.getElementById("progress").textContent = "";
  document.getElementById("barFill").style.width = "100%";
  document.getElementById("feedback").textContent = "";

  const explain = document.getElementById("explain");
  explain.className = "explain result";

  if (score === questions.length) {
    explain.textContent = "Utmärkt resultat!";
  } else if (score >= 6) {
    explain.textContent = "Riktigt bra jobbat!";
  } else if (score >= 4) {
    explain.textContent = "Bra jobbat — du har koll på mycket!";
  } else {
    explain.textContent = "Fortsätt öva, så sitter det snart!";
  }

  nextBtn.classList.add("hidden");
  restartBtn.classList.remove("hidden");
}

function resetQuiz() {
  questionIndex = 0;
  score = 0;

  quizPage.classList.add("hidden");
  page1.classList.add("hidden");
  page0.classList.remove("hidden");

  nextBtn.classList.remove("hidden");
  nextBtn.classList.add("ghosted");
  restartBtn.classList.add("hidden");
  document.getElementById("explain").className = "explain";
}

// Tangentbord: Enter eller mellanslag aktiverar knappar.
// A, B och C väljer motsvarande svarsalternativ.
document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  if (key === "enter" || key === " ") {
    const activePage = [page0, page1, quizPage]
      .find(page => !page.classList.contains("hidden"));

    if (!activePage) return;

    if (!quizPage.classList.contains("hidden")) {
      if (!nextBtn.classList.contains("hidden") &&
          !nextBtn.classList.contains("ghosted")) {
        event.preventDefault();
        nextBtn.click();
      } else if (!restartBtn.classList.contains("hidden")) {
        event.preventDefault();
        restartBtn.click();
      }
    } else {
      const button = activePage.querySelector("button");
      if (button) {
        event.preventDefault();
        button.click();
      }
    }

    return;
  }

  if (!quizPage.classList.contains("hidden")) {
    const answerIndex = { a: 0, b: 1, c: 2 }[key];

    if (answerIndex !== undefined) {
      const buttons = document.querySelectorAll("#options button");
      if (buttons[answerIndex] && !buttons[answerIndex].disabled) {
        buttons[answerIndex].click();
      }
    }
  }
});
</script>
</body>
</html>
